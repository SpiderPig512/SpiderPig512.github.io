<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校長老師序言 ~ 社長 社代表 心聲 - Golden Yinnies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f4ec;
    --brown:#4a2a12;
    --brown-deep:#3a2010;
    --panel:#a98868;
    --gold-dark:#d99e1f;
    --ink:#242018;
    --ink-dim:#4a4a4a;
    --sans:"Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
  }

  /* ---------- NAV ---------- */
  .site-nav{
    background:var(--brown);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    padding:0 clamp(16px, 4vw, 40px);
  }
  .site-nav a{
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:clamp(.8rem, 1.3vw, 1rem);
    padding:clamp(14px, 2.2vw, 20px) clamp(10px, 1.6vw, 20px);
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }
  .site-nav a.active{ color:#d7e02a; }
  .site-nav a:hover{ color:var(--gold-dark); }
  .site-nav a .caret{
    font-size:.65em;
    margin-left:2px;
    transform:translateY(1px);
  }

  /* ---------- TOP ---------- */
  .top-section{
    padding:clamp(28px, 5vw, 46px) clamp(16px, 4vw, 40px) clamp(10px, 2vw, 20px);
  }
  .page-title{
    text-align:center;
    font-size:clamp(1.2rem, 3vw, 2rem);
    font-weight:500;
    letter-spacing:.06em;
    margin:0 0 clamp(18px, 3vw, 26px);
  }

  /* ---------- BRICK DIVIDER ---------- */
  .brick-wrap{
    max-width:1600px;
    height:clamp(16px, 2.6vw, 26px);
    margin:0 auto clamp(24px, 4.5vw, 40px);
    background-image:repeating-linear-gradient(
      -22deg,
      #1c1c1c 0px,
      #1c1c1c 14px,
      transparent 14px,
      transparent 24px
    );
  }

  /* ---------- PANEL ---------- */
  .panel{
    max-width:1600px;
    margin:0 auto clamp(20px, 4vw, 34px);
    background:var(--panel);
    padding:clamp(18px, 3vw, 34px);
    border-radius:2px;
  }
  .card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(18px, 3vw, 34px);
  }
  .card{
    background:#fff;
    padding:clamp(18px, 3vw, 30px);
  }
  .card.card-full{
    padding:0;
    overflow:hidden;
    display:flex;
  }
  .full-slide{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .card-heading{
    font-size:clamp(.85rem, 1.5vw, 1rem);
    font-weight:700;
    margin:0 0 16px;
  }
  .avatar{
    width:100%;
    max-width:260px;
    aspect-ratio:3/4;
    margin:0 auto 14px;
    display:block;
    background:#e4e4e4;
    overflow:hidden;
  }
  .avatar img, .avatar svg{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-name{
    text-align:center;
    font-weight:700;
    font-size:clamp(.95rem, 1.7vw, 1.15rem);
    margin:0 0 16px;
  }
  .card-text{
    font-size:clamp(.8rem, 1.4vw, .92rem);
    line-height:1.9;
    color:var(--ink);
    text-align:justify;
  }
  .card-text + .card-text{ margin-top:12px; }
  .poem{
    display:flex;
    flex-direction:column;
    gap:clamp(14px, 2.6vw, 22px);
    align-items:center;
    margin-top:16px;
  }
  .poem p{
    margin:0;
    font-size:clamp(1rem, 2vw, 1.3rem);
    font-weight:700;
    letter-spacing:clamp(4px, 1.4vw, 12px);
  }

  /* ---------- POST VIEWS ---------- */
  .post-views{
    max-width:1600px;
    margin:clamp(14px, 2.5vw, 20px) auto 0;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--gold-dark);
    font-size:.9rem;
    padding:0 clamp(16px, 4vw, 40px) clamp(40px, 6vw, 60px);
  }
  .post-views svg{ width:16px; height:16px; }

  /* ---------- FOOTER ---------- */
  .site-footer{
    text-align:center;
    font-size:clamp(.82rem, 1.4vw, .98rem);
    color:var(--ink-dim);
    padding:clamp(20px, 3vw, 30px) 20px clamp(40px, 6vw, 60px);
  }
  .site-footer a{
    color:var(--ink-dim);
    text-decoration:none;
    margin:0 clamp(6px, 1.2vw, 14px);
  }
  .site-footer a:hover{ text-decoration:underline; }
  .site-footer .sub{ margin-top:4px; }

  @media (max-width:760px){
    .card-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <nav class="site-nav">

    <a href="#">編後頁 <span class="caret">▾</span></a>
    <a href="#">最新上載 <span class="caret">▾</span></a>
  </nav>

  <div class="top-section">
    <h1 class="page-title">校長老師序言 ~ 社長 社代表 心聲</h1>

    <!-- BRICK DIVIDER -->
    <div class="brick-wrap"></div>

    <!-- PANEL -->
    <div class="panel">
      <div class="card-grid">

        <!-- LEFT CARD -->
        <div class="card card-full">
          <img class="full-slide" src="images/liu-kei-mei-slide.png" alt="社代表心聲 - 劉紀美">

        <!-- RIGHT CARD -->
        <div class="card card-full">
          <img class="full-slide" src="images/yiu-lan-lei-slide.png" alt="社長心聲 - 姚蘭莉">
        </div>

      </div>
    </div>

    <!-- POST VIEWS -->
    <div class="post-views">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="14" width="4" height="7" fill="currentColor"/>
        <rect x="10" y="9" width="4" height="12" fill="currentColor"/>
        <rect x="17" y="4" width="4" height="17" fill="currentColor"/>
      </svg>
      Post Views: 60
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="links">
      <a href="index.html">主頁</a>

      <a href="#">55 翡翠禧</a>
      <a href="#">母校培正</a>
      <a href="#">賢社</a>
      <a href="#">同學</a>
      <a href="#">那些時光</a>
      <a href="#">流金歲月</a>
      <a href="#">編後頁</a>
    </div>
    <div class="sub"><a href="#">最新上載</a></div>
  </footer>

</body>
</html>
