<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 週年慶祝 ~ 9 月美加預祝 ~ 金禧聚餐加冕 ~ 節目及座位表 - Golden Yinnies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f4ec;
    --green:#0d3a10;
    --green-deep:#082708;
    --gold:#f2b73e;
    --gold-dark:#d99e1f;
    --ink:#1c1c1c;
    --ink-dim:#4a4a4a;
    --active:#d7e02a;
    --sans:"Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
  }

  /* ---------- NAV ---------- */
  nav{
    background:var(--green);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    padding:0 clamp(16px, 4vw, 40px);
  }
  nav a{
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:clamp(.82rem, 1.3vw, 1rem);
    padding:clamp(16px, 2.4vw, 22px) clamp(10px, 1.6vw, 20px);
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }
  nav a.active{ color:var(--active); }
  nav a:hover{ color:var(--gold); }
  nav a .caret{
    font-size:.65em;
    margin-left:2px;
    transform:translateY(1px);
  }

  /* ---------- TOP ---------- */
  .top-section{
    padding:clamp(28px, 5vw, 46px) clamp(16px, 4vw, 40px) clamp(10px, 2vw, 20px);
  }
  .page-title{
    text-align:center;
    font-size:clamp(1.05rem, 2.6vw, 1.85rem);
    font-weight:500;
    letter-spacing:.04em;
    margin:0 0 clamp(18px, 3vw, 26px);
  }

  /* ---------- HATCH DIVIDER ---------- */
  .hatch-wrap{
    max-width:1500px;
    margin:0 auto clamp(28px, 5vw, 46px);
  }
  .hatch-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }

  /* ---------- BUTTONS ---------- */
  .btn-row{
    max-width:1500px;
    margin:0 auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:clamp(30px, 6vw, 90px);
  }
  .prog-btn{
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    color:var(--green-deep);
    font-weight:700;
    font-size:clamp(.85rem, 1.5vw, 1.02rem);
    text-decoration:none;
    text-align:center;
    padding:clamp(14px, 2.2vw, 18px) clamp(30px, 4vw, 46px);
    border-radius:6px;
    box-shadow:0 6px 14px rgba(0,0,0,0.2);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .prog-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,0,0,0.25);
  }

  /* ---------- POST VIEWS ---------- */
  .post-views{
    max-width:1500px;
    margin:clamp(18px, 3vw, 26px) auto 0;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--gold-dark);
    font-size:.9rem;
  }
  .post-views svg{ width:16px; height:16px; }

  /* ---------- FOOTER ---------- */
  .site-footer{
    text-align:center;
    font-size:clamp(.82rem, 1.4vw, .98rem);
    color:var(--ink-dim);
    padding:clamp(40px, 6vw, 60px) 20px clamp(40px, 6vw, 60px);
  }
  .site-footer a{
    color:var(--ink-dim);
    text-decoration:none;
    margin:0 clamp(6px, 1.2vw, 14px);
  }
  .site-footer a:hover{ text-decoration:underline; }
  .site-footer .sub{ margin-top:4px; }
</style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html">主頁</a>
    <a href="jubilee.html" class="active">50 金禧 <span class="caret">▾</span></a>
    <a href="#">55 翡翠禧</a>
    <a href="#">母校培正 <span class="caret">▾</span></a>
    <a href="#">賢社 <span class="caret">▾</span></a>

    <a href="#">那些時光 <span class="caret">▾</span></a>
    <a href="#">流金歲月 <span class="caret">▾</span></a>
    <a href="#">編後頁 <span class="caret">▾</span></a>
    <a href="#">最新上載 <span class="caret">▾</span></a>
  </nav>

  <div class="top-section">
    <h1 class="page-title">50 週年慶祝 ~ 9 月美加預祝 ~ 金禧聚餐加冕 ~ 節目及座位表</h1>

    <!-- HATCH DIVIDER -->
    <div class="hatch-wrap">
      <svg viewBox="0 0 1500 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <pattern id="hatch" width="20" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
            <rect width="12" height="24" fill="#1c1c1c"/>
          </pattern>
        </defs>
        <rect width="1500" height="24" fill="url(#hatch)"/>
      </svg>
    </div>

    <!-- BUTTONS -->
    <div class="btn-row">
      <a class="prog-btn" href="#">節目</a>
      <a class="prog-btn" href="#">座位表</a>
    </div>

    <!-- POST VIEWS -->
    <div class="post-views">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="14" width="4" height="7" fill="currentColor"/>
        <rect x="10" y="9" width="4" height="12" fill="currentColor"/>
        <rect x="17" y="4" width="4" height="17" fill="currentColor"/>
      </svg>
      Post Views: 51
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="links">
      <a href="index.html">主頁</a>
      <a href="jubilee.html">50 金禧</a>
      <a href="#">55 翡翠禧</a>
      <a href="#">母校培正</a>
      <a href="#">賢社</a>
      <a href="#">同學</a>
      <a href="#">那些時光</a>
      <a href="#">流金歲月</a>
      <a href="#">編後頁</a>
    </div>
    <div class="sub"><a href="#">最新上載</a></div>
  </footer>

</body>
</html>
